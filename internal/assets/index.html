<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>freeseek</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light dark;
        --page: #f4f2ee;
        --surface: #fffdf9;
        --ink: #2f2a25;
        --soft: #6e655d;
        --muted: #9a9289;
        --line: rgba(110, 101, 93, 0.16);
        --line-strong: rgba(110, 101, 93, 0.3);
        --accent: #b4532a;
        --user: #ebe6dd;
        --code: #f0ece5;
        --error: #b3261e;
        --shadow: 0 10px 34px rgba(88, 79, 69, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #171513;
          --surface: #1f1c19;
          --ink: #ece6dc;
          --soft: #b3aa9f;
          --muted: #857c72;
          --line: rgba(236, 230, 220, 0.1);
          --line-strong: rgba(236, 230, 220, 0.2);
          --accent: #e58a5c;
          --user: #2a2622;
          --code: #12100e;
          --error: #ff8a80;
          --shadow: 0 10px 34px rgba(0, 0, 0, 0.3);
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font: 16px/1.6 "Instrument Sans", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
      }
      button, select, input, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* top bar */
      .bar {
        position: sticky; top: 0; z-index: 5;
        display: flex; align-items: center; gap: 10px;
        padding: 10px max(16px, env(safe-area-inset-left)) 10px max(16px, env(safe-area-inset-right));
        background: color-mix(in srgb, var(--page) 88%, transparent);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
      }
      .brand { font: 600 22px/1 "Cormorant Garamond", serif; letter-spacing: 0.01em; margin-right: auto; }
      .bar select, .ghost {
        height: 36px; border-radius: 10px; border: 1px solid var(--line-strong);
        background: var(--surface); padding: 0 12px;
      }
      .bar select { min-width: 0; max-width: 52vw; flex: 0 1 auto; text-overflow: ellipsis; }
      .bar > * { flex-shrink: 0; }
      .bar > select { flex-shrink: 1; }
      .ghost { display: inline-flex; align-items: center; gap: 6px; }
      .ghost:hover { border-color: var(--soft); }
      .ghost svg { width: 16px; height: 16px; }
      .ghost .label { display: inline; }
      .ghost.warn { border-color: var(--error); color: var(--error); }

      /* settings */
      .settings {
        position: absolute; right: 16px; top: 54px; width: min(340px, calc(100vw - 32px));
        background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px;
        padding: 14px; box-shadow: var(--shadow);
      }
      .settings label { display: block; font-size: 13px; color: var(--soft); margin-bottom: 6px; }
      .settings input {
        width: 100%; height: 38px; border-radius: 10px; border: 1px solid var(--line-strong);
        background: var(--page); padding: 0 10px;
      }
      .settings p { margin: 8px 0 0; font-size: 13px; color: var(--muted); }

      /* transcript */
      main { flex: 1; width: 100%; max-width: 820px; margin: 0 auto; padding: 24px 16px 8px; }
      .empty { text-align: center; padding: 12vh 0 4vh; }
      .empty h1 { font: 600 clamp(36px, 7vw, 64px)/1.05 "Cormorant Garamond", serif; margin: 0 0 12px; color: var(--soft); }
      .empty p { margin: 0; color: var(--muted); }
      .msg { margin: 0 0 22px; }
      .msg.user { display: flex; justify-content: flex-end; }
      .msg.user .body {
        background: var(--user); border-radius: 16px 16px 4px 16px; padding: 10px 14px;
        max-width: min(85%, 640px); white-space: pre-wrap; overflow-wrap: anywhere;
      }
      .msg.assistant .body { overflow-wrap: anywhere; }
      .msg.error .body { color: var(--error); border-left: 3px solid var(--error); padding-left: 12px; }
      .meta { display: flex; gap: 12px; margin-top: 4px; font-size: 12px; color: var(--muted); }
      .meta button { border: 0; background: none; padding: 0; color: var(--muted); }
      .meta button:hover { color: var(--ink); }
      .think { margin: 0 0 10px; border-left: 2px solid var(--line-strong); padding-left: 12px; color: var(--soft); font-size: 14.5px; }
      .think summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; }
      .think summary::before { content: "▸ "; }
      .think[open] summary::before { content: "▾ "; }
      .think .md { margin-top: 6px; }
      .cursor::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      /* markdown */
      .md > :first-child { margin-top: 0; }
      .md > :last-child { margin-bottom: 0; }
      .md p, .md ul, .md ol, .md pre, .md blockquote { margin: 0 0 12px; }
      .md h1, .md h2, .md h3 { font-size: 1.08em; margin: 18px 0 8px; }
      .md ul, .md ol { padding-left: 22px; }
      .md li { margin: 2px 0; }
      .md code { font: 0.9em/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); border-radius: 5px; padding: 1px 5px; }
      .md pre { position: relative; background: var(--code); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; }
      .md pre code { background: none; padding: 0; font-size: 13.5px; }
      .md pre .copy { position: absolute; top: 6px; right: 6px; font-size: 12px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 6px; padding: 2px 8px; color: var(--soft); }
      .md blockquote { border-left: 3px solid var(--line-strong); padding-left: 12px; color: var(--soft); }
      .md a { color: var(--accent); }
      .md hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }

      /* composer */
      .dock { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--page) 22%); padding: 14px 16px max(14px, env(safe-area-inset-bottom)); }
      form:focus-within { border-color: var(--soft); }
      form { max-width: 820px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 18px; box-shadow: var(--shadow); padding: 10px 10px 8px 14px; }
      textarea { width: 100%; border: 0; background: transparent; resize: none; outline: none !important; min-height: 28px; max-height: 40vh; padding: 4px 0; line-height: 1.5; }
      .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .toggle { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 999px; font-size: 14px; color: var(--soft); user-select: none; }
      .toggle input { accent-color: var(--accent); margin: 0; }
      .toggle:has(input:checked) { color: var(--ink); border-color: var(--accent); }
      .toggle[hidden] { display: none; }
      .hint { font-size: 12px; color: var(--muted); margin-left: auto; }
      .hint + .send { margin-left: 0; }
      .send { margin-left: auto; width: 38px; height: 38px; border-radius: 12px; border: 0; background: var(--ink); color: var(--page); display: inline-grid; place-items: center; }
      .send:disabled { opacity: 0.35; cursor: default; }
      .send svg { width: 18px; height: 18px; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

      @media (max-width: 560px) {
        .ghost .label, .hint { display: none; }
        .brand { font-size: 20px; }
        .bar { gap: 8px; }
        .bar select { max-width: 46vw; }
        .hint + .send { margin-left: auto; }
        main { padding-top: 16px; }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <span class="brand">freeseek</span>
      <label class="sr" for="model">Model</label>
      <select id="model"></select>
      <button id="new-chat" class="ghost" type="button" title="New chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        <span class="label">New chat</span>
      </button>
      <button id="key-button" class="ghost" type="button" title="API key" aria-expanded="false" aria-controls="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4.5" /><path d="m10.7 12.3 9.3-9.3M17 6l3 3M15 8l2 2" /></svg>
        <span class="label">Key</span>
      </button>
      <div id="settings" class="settings" hidden>
        <label for="api-key">Proxy API key</label>
        <input id="api-key" type="password" autocomplete="off" placeholder="Paste the proxy's API_KEY" />
        <p>Saved in this browser only. Sent as a Bearer token to this proxy.</p>
      </div>
    </header>

    <main id="transcript" aria-live="polite"></main>

    <div class="dock">
      <form id="composer">
        <label class="sr" for="prompt">Message</label>
        <textarea id="prompt" rows="1" placeholder="Ask anything" autocomplete="off"></textarea>
        <div class="controls">
          <label class="toggle" id="thinking-wrap"><input id="thinking" type="checkbox" /> Thinking</label>
          <label class="toggle" id="search-wrap"><input id="search" type="checkbox" /> Search</label>
          <span class="hint">Enter to send · Shift+Enter for a new line</span>
          <button id="send" class="send" type="submit" aria-label="Send" disabled></button>
        </div>
      </form>
    </div>

    <script>
      const $ = (s) => document.querySelector(s);
      const transcript = $("#transcript"), form = $("#composer"), prompt = $("#prompt"), send = $("#send");
      const modelSel = $("#model"), keyInput = $("#api-key"), keyBtn = $("#key-button"), settings = $("#settings");
      const thinking = $("#thinking"), search = $("#search");
      const ICON_SEND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
      const ICON_STOP = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
      const LABELS = { "deepseek-chat": "DeepSeek", "deepseek-reasoner": "DeepSeek (thinking)", "taalas-llama3.1-8b": "Llama 3.1 8B" };
      const store = {
        get: (k, d) => { try { const v = localStorage.getItem("fs." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
        set: (k, v) => localStorage.setItem("fs." + k, JSON.stringify(v)),
      };

      let history = store.get("history", []);
      let controller = null;

      // ---------- markdown (escape first, then add a small safe subset) ----------
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      function inline(s) {
        const codes = [];
        s = s.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
        s = esc(s)
          .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/(^|[^*\w])\*(?=\S)([^*\n]*?\S)\*(?![\w*])/g, "$1<em>$2</em>");
        return s.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + esc(codes[+i]) + "</code>");
      }
      function markdown(src) {
        const out = [], lines = src.replace(/\r/g, "").split("\n");
        let i = 0, para = [];
        const flush = () => { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
        while (i < lines.length) {
          const line = lines[i];
          const fence = line.match(/^\s*```\s*([\w+-]*)/);
          if (fence) {
            flush();
            const code = [];
            i++;
            while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
            i++;
            out.push('<pre><button class="copy" type="button">Copy</button><code>' + esc(code.join("\n")) + "</code></pre>");
            continue;
          }
          let m;
          if ((m = line.match(/^(#{1,6})\s+(.*)/))) { flush(); const n = Math.min(m[1].length + 1, 3); out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++; continue; }
          if (/^\s*(?:[-*_]\s*){3,}$/.test(line) && !/^\s*[-*]\s+\S/.test(line)) { flush(); out.push("<hr>"); i++; continue; }
          if (/^\s*>/.test(line)) {
            flush();
            const q = [];
            while (i < lines.length && /^\s*>/.test(lines[i])) q.push(lines[i++].replace(/^\s*>\s?/, ""));
            out.push("<blockquote>" + markdown(q.join("\n")) + "</blockquote>");
            continue;
          }
          if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
            flush();
            const ordered = /^\s*\d/.test(line), items = [];
            while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
              let item = lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, "");
              while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) item += " " + lines[i++].trim();
              items.push("<li>" + inline(item) + "</li>");
            }
            out.push((ordered ? "<ol>" : "<ul>") + items.join("") + (ordered ? "</ol>" : "</ul>"));
            continue;
          }
          if (!line.trim()) { flush(); i++; continue; }
          para.push(line);
          i++;
        }
        flush();
        return out.join("");
      }

      // ---------- rendering ----------
      function render() {
        transcript.innerHTML = "";
        if (!history.length) {
          transcript.innerHTML = '<div class="empty"><h1>What would you like to do?</h1><p>Ask anything. Replies stream in as they are written.</p></div>';
          return;
        }
        history.forEach((m, i) => transcript.appendChild(messageNode(m.role, m.content, i, m.reasoning)));
      }
      function thinkNode(text, open) {
        const d = document.createElement("details");
        d.className = "think";
        d.open = open;
        d.innerHTML = '<summary>Thinking</summary><div class="md"></div>';
        d.lastChild.innerHTML = markdown(text);
        return d;
      }
      function messageNode(role, content, index, reasoning) {
        const wrap = document.createElement("div");
        wrap.className = "msg " + role;
        const body = document.createElement("div");
        body.className = "body" + (role === "assistant" ? " md" : "");
        if (role === "assistant") body.innerHTML = markdown(content); else body.textContent = content;
        if (reasoning) wrap.appendChild(thinkNode(reasoning, false));
        wrap.appendChild(body);
        if (role === "assistant" && index !== undefined) wrap.appendChild(metaNode(content));
        return wrap;
      }
      function metaNode(content) {
        const meta = document.createElement("div");
        meta.className = "meta";
        const copy = document.createElement("button");
        copy.type = "button"; copy.textContent = "Copy";
        copy.onclick = () => navigator.clipboard.writeText(content).then(() => { copy.textContent = "Copied"; setTimeout(() => (copy.textContent = "Copy"), 1200); });
        meta.appendChild(copy);
        return meta;
      }
      function errorNode(text) {
        const n = messageNode("error", text);
        transcript.appendChild(n);
        n.scrollIntoView({ block: "end" });
      }
      transcript.addEventListener("click", (e) => {
        const b = e.target.closest("pre .copy");
        if (!b) return;
        navigator.clipboard.writeText(b.nextElementSibling.textContent).then(() => { b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1200); });
      });
      const nearBottom = () => window.innerHeight + window.scrollY >= document.body.scrollHeight - 120;

      // ---------- models and settings ----------
      async function loadModels() {
        let ids = ["deepseek-chat", "deepseek-reasoner", "taalas-llama3.1-8b"];
        try {
          const r = await fetch("/v1/models");
          if (r.ok) ids = (await r.json()).data.map((m) => m.id);
        } catch {}
        modelSel.innerHTML = ids.map((id) => `<option value="${esc(id)}">${esc(LABELS[id] || id)}</option>`).join("");
        const saved = store.get("model", "deepseek-chat");
        modelSel.value = ids.includes(saved) ? saved : ids[0];
        syncToggles();
      }
      function syncToggles() {
        const ds = modelSel.value.startsWith("deepseek");
        $("#thinking-wrap").hidden = !ds || modelSel.value === "deepseek-reasoner";
        $("#search-wrap").hidden = !ds;
      }
      modelSel.onchange = () => { store.set("model", modelSel.value); syncToggles(); };
      thinking.checked = store.get("thinking", false);
      search.checked = store.get("search", false);
      thinking.onchange = () => store.set("thinking", thinking.checked);
      search.onchange = () => store.set("search", search.checked);
      keyInput.value = store.get("apiKey", "");
      keyInput.oninput = () => { store.set("apiKey", keyInput.value.trim()); keyBtn.classList.remove("warn"); };
      function toggleSettings(open) {
        settings.hidden = !open;
        keyBtn.setAttribute("aria-expanded", String(open));
        if (open) keyInput.focus();
      }
      keyBtn.onclick = () => toggleSettings(settings.hidden);
      document.addEventListener("click", (e) => { if (!settings.hidden && !settings.contains(e.target) && !keyBtn.contains(e.target)) toggleSettings(false); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") toggleSettings(false); });
      $("#new-chat").onclick = () => { if (controller) controller.abort(); history = []; store.set("history", history); render(); prompt.focus(); };

      // ---------- composer ----------
      function setBusy(busy) {
        send.innerHTML = busy ? ICON_STOP : ICON_SEND;
        send.setAttribute("aria-label", busy ? "Stop" : "Send");
        send.disabled = !busy && !prompt.value.trim();
      }
      function autosize() { prompt.style.height = "auto"; prompt.style.height = prompt.scrollHeight + "px"; }
      prompt.addEventListener("input", () => { autosize(); if (!controller) send.disabled = !prompt.value.trim(); });
      prompt.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
      });
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (controller) { controller.abort(); return; }
        const text = prompt.value.trim();
        if (!text) return;
        prompt.value = ""; autosize();
        ask(text);
      });

      async function ask(text) {
        if (!history.length) transcript.innerHTML = "";
        history.push({ role: "user", content: text });
        store.set("history", history);
        transcript.appendChild(messageNode("user", text));

        const node = messageNode("assistant", "");
        const body = node.querySelector(".body");
        body.classList.add("cursor");
        transcript.appendChild(node);
        node.scrollIntoView({ block: "end" });

        controller = new AbortController();
        setBusy(true);
        let reply = "", reasoning = "", think = null;
        try {
          const headers = { "Content-Type": "application/json" };
          const key = keyInput.value.trim();
          if (key) headers.Authorization = "Bearer " + key;
          const ds = modelSel.value.startsWith("deepseek");
          const res = await fetch("/v1/chat/completions", {
            method: "POST",
            headers,
            signal: controller.signal,
            body: JSON.stringify({
              model: modelSel.value,
              stream: true,
              messages: history.map((m) => ({ role: m.role, content: m.content })),
              thinking_enabled: ds && thinking.checked,
              search_enabled: ds && search.checked,
            }),
          });
          if (!res.ok) {
            let msg = res.status + " " + res.statusText;
            try { const j = await res.json(); if (j.error && j.error.message) msg = j.error.message; } catch {}
            if (res.status === 401) { keyBtn.classList.add("warn"); toggleSettings(true); msg = "The proxy needs an API key. Paste it under Key, then send again."; }
            throw new Error(msg);
          }
          const reader = res.body.getReader(), decoder = new TextDecoder();
          let buf = "";
          for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const lines = buf.split("\n");
            buf = lines.pop();
            let changed = false;
            for (const line of lines) {
              if (!line.startsWith("data:")) continue;
              const data = line.slice(5).trim();
              if (!data || data === "[DONE]") continue;
              try {
                const d = JSON.parse(data).choices?.[0]?.delta || {};
                if (d.reasoning_content) {
                  reasoning += d.reasoning_content; changed = true;
                  if (!think) { think = thinkNode("", true); node.insertBefore(think, body); }
                }
                if (d.content) { reply += d.content; changed = true; }
              } catch {}
            }
            if (changed) {
              const stick = nearBottom();
              if (think) {
                think.lastChild.innerHTML = markdown(reasoning);
                if (reply && think.open && !think.dataset.closed) { think.open = false; think.dataset.closed = "1"; }
              }
              body.innerHTML = markdown(reply);
              if (stick) node.scrollIntoView({ block: "end" });
            }
          }
          if (!reply) throw new Error("The model sent an empty reply.");
        } catch (err) {
          if (err.name !== "AbortError") {
            if (!reply) { node.remove(); history.pop(); store.set("history", history); prompt.value = text; autosize(); }
            errorNode(err.message || "Something went wrong.");
          }
        } finally {
          body.classList.remove("cursor");
          if (reply) {
            history.push(reasoning ? { role: "assistant", content: reply, reasoning } : { role: "assistant", content: reply });
            store.set("history", history);
            body.innerHTML = markdown(reply);
            node.appendChild(metaNode(reply));
          } else if (node.isConnected) {
            node.remove();
            if (history.at(-1)?.role === "user") { history.pop(); store.set("history", history); prompt.value = text; autosize(); }
          }
          controller = null;
          setBusy(false);
          prompt.focus();
        }
      }

      setBusy(false);
      render();
      loadModels();
      prompt.focus();
    </script>
  </body>
</html>
